<!DOCTYPE html>
<html>
<head>
<title>Admin - Member List</title>

<style>
table{
    border-collapse:collapse;
    width:95%;
    margin:auto;
    font-family:Arial;
}
td,th{
    border:1px solid gray;
    padding:8px;
    font-size:13px;
}
th{
    background:#f0f0f0;
}
button{
    padding:6px 10px;
    cursor:pointer;
}
</style>

#printHeader{
    display:none;
}

@media print{

#printHeader{
    display:block;
}

}

<style>

@media print {

@page{
    size:landscape;
}


    body{
        margin:15px;
        font-family:Arial, sans-serif;
    }

    button{
        display:none;
    }

    select{
        display:none;
    }

    input{
        display:none;
    }

    h1{
        text-align:center;
        margin-bottom:5px;
    }

    table{
        width:100%;
        border-collapse:collapse;
        font-size:12px;
    }

    table th,
    table td{
        border:1px solid black;
        padding:4px;
    }

}

</style>


</head>

<body style="text-align:center;font-family:Arial;">

<h2>📋 Admin Member Register</h2>

<!-- SORT -->
<label>Sort By:</label>
<select id="sortBy">
    <option value="">-- Select --</option>
    <option value="firstName">First Name</option>
    <option value="lastName">Last Name</option>
    <option value="city">City</option>
    <option value="state">State</option>
    <option value="country">Country</option>
    <option value="NativeLocation">Native Location</option>
</select>

<!-- VALUE -->
<label>Value:</label>
<select id="sortValue">
    <option value="">-- Select Value --</option>
</select>

<br><br>

<button onclick="copyAll()">📋 Copy List</button>

<button onclick="exportRegister()">
    Export Register
</button>

<br><br>


<button onclick="printRegister()">
    🖨 Print Register🐇
</button>



<div id="printHeader">

<h1>LencoAbroad Alumni Association</h1>

<h2 style="text-align:center;">
Complete Member Register
</h2>

<p id="printInfo"
style="text-align:center;font-weight:bold;">
</p>
<div>




<table id="memberTable"></table>

<br>
<button onclick="location.href='adminPanel.html'">⬅ Back</button>

<script>

let filterData = {};
let lastListText = "";

/* =========================
   LOAD FILTER VALUES
========================= */
async function loadFilterValues() {
   // const res = await fetch("http://localhost:3000/get-member-filter-values");
    const res = await fetch("/get-member-filter-values");

    filterData = await res.json();
}

/* =========================
   POPULATE DROPDOWN
========================= */
document.getElementById("sortBy").addEventListener("change", function () {

    const sortValue = document.getElementById("sortValue");
    sortValue.innerHTML = `<option value="">-- Select Value --</option>`;

    let list = [];

    if (this.value === "firstName") list = filterData.names || [];
    if (this.value === "lastName") list = filterData.names || [];
    if (this.value === "city") list = filterData.cities || [];
    if (this.value === "state") list = filterData.states || [];
    if (this.value === "country") list = filterData.countries || [];
    if (this.value === "NativeLocation") list = filterData.natives || [];

    list.forEach(v => {
        sortValue.innerHTML += `<option value="${v}">${v}</option>`;
    });

    loadMembers();
});

/* =========================
   VALUE CHANGE
========================= */
document.getElementById("sortValue").addEventListener("change", function () {
    loadMembers();
});

/* =========================
   LOAD MEMBERS
========================= */
async function loadMembers(){

    const sortBy = document.getElementById("sortBy").value;
    const filterValue = document.getElementById("sortValue").value;

    const res = await fetch(
       // "http://localhost:3000/admin-members?sortBy=" + sortBy +
        "/admin-members?sortBy=" + sortBy +
        "&filterValue=" + encodeURIComponent(filterValue)
    );

   
 const result = await res.json();

    const table = document.getElementById("memberTable");
    table.innerHTML = "";

  if(!result.success){
        table.innerHTML = "<tr><td>Error loading members</td></tr>";
        return;
    }

 
///////

    document.getElementById("printInfo").innerHTML =
  "Printed on : "
  + new Date().toLocaleDateString()
  +
  " &nbsp;&nbsp;&nbsp;&nbsp; Total Members : "
  + result.members.length;

    table.innerHTML += `
        <tr>
            <th>First</th>
            <th>Last</th>
            <th>Spouce</th>
            <th>Degree</th>
            <th>Branch</th>
            <th>PassingYear</th>
            <th>Masters</th>
            <th>Profession</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Business/Employer</th>
            <th>Country</th>
            <th>State</th>
            <th>City</th>
            <th>Native</th>
             <th>code</th>
             <th>Usermane</th>
             <th>Date</th>

        </tr>
    `;

    lastListText = "";

    result.members.forEach(m => {

        const rowText =
        `${m.firstName} ${m.lastName}, ${m.mobileNumber}, ${m.EmailAddress}, ${m.city}, ${m.state}, ${m.country}, ${m.NativeLocation}`;

        lastListText += rowText + "\n";

        table.innerHTML += `
            <tr>
                <td>${m.firstName}</td>
                <td>${m.lastName}</td>
                <td>${m.spouseName}</td>
                <td>${m.degree}</td>
                <td>${m.branch}</td>
                <td>${m.graduationYear}</td>
                <td>${m.mastersBranch}</td>
                <td>${m.profession}</td>
                <td>${m.mobileNumber}</td>
                <td>${m.EmailAddress}</td>
                <td>${m.EmployerBusinessName}</td>
                <td>${m.country}</td>
                <td>${m.state}</td>
                <td>${m.city}</td>
                <td>${m.NativeLocation}</td>
                <td>${m.memberCode}</td>
                <td>${m.username}</td>
                 <td>${m.date}</td>
           </tr>
        `;
    });
}

/* =========================
   COPY ALL
========================= */


function copyAll() {

    const table = document.getElementById("memberTable");

    const html = table.outerHTML;

    const blobHTML = new Blob([html], { type: "text/html" });
    const blobText = new Blob([table.innerText], { type: "text/plain" });

    const data = [new ClipboardItem({
        "text/html": blobHTML,
        "text/plain": blobText
    })];

    navigator.clipboard.write(data).then(() => {
        alert("Table copied with full formatting!");
    });
}


/* =========================
   INIT
========================= */
window.onload = async function(){
    await loadFilterValues();
    await loadMembers();
};


function exportRegister() {

    window.location.href = "/export-member-register";

}


function printRegister() {
    window.print();
}




</script>

</body>
</html>
