<!DOCTYPE html>
<html>
<head>
  <title>Alumni ChatRooms</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6f9;
      overflow: hidden;
    }

    h1 {
      color: darkblue;
      margin: 20px 0;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    #pageArea {
      position: relative;
      width: 100%;
      height: 90vh;
    }

    #picsArea {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .picBox {
      position: absolute;
      object-fit: cover;
      opacity: 0.85;
      border-radius: 8px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
      pointer-events: none;
    }

    .box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid #ccc;
      padding: 30px;
      border-radius: 10px;
      width: 450px;
      background: white;
      box-shadow: 2px 2px 8px #aaa;
      z-index: 10;
      text-align: center;
    }

    .box a {
      display: block;
      margin: 12px auto;
      padding: 12px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      width: 90%;
    }

    .box a:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

<h1>Alumni Members ChatRooms</h1>

<div id="pageArea">

  <div id="picsArea"></div>

  <div class="box">
    <a href="/chat/chatrooms.html">CLICK TO SEE CHAT ROOMS LIST</a>
  </div>

</div>




<script>
/* PUT YOUR REAL FILE NAMES HERE */
const techPics = [
 "1.jpg","2.jpg","3.jpg","4.jpg","5.jpg",
  "6.jpg","7.jpg","8.jpg","9.jpg","10.jpg",
  "11.jpg","12.jpg","13.jpg","14.jpg","15.jpg",
  "16.jpg","17.jpg","18.jpg","19.jpg","20.jpg",
  "21.jpg","22.jpg","23.jpg","24.jpg","25.jpg",
  "26.jpg","27.jpg","28.jpg","29.jpg","30.jpg",
  "31.jpg","32.jpg","33.jpg","34.jpg","35.jpg",
  "36.jpg","37.jpg","38.jpg","39.jpg","40.jpg",
  "41.jpg","42.jpg","43.jpg","44.jpg"
];

const picsArea = document.getElementById("picsArea");

/* SETTINGS */
const picSize = 90;        // picture size
const gap = 30;            // distance between pics
const topMargin = 70;      // leave space for title
const sideMargin = 30;

/* FIXED SEED RANDOM (NO CHANGE ON REFRESH) */
let seed = 12345;
function seededRandom(){
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

/* Shuffle pictures using fixed seed */
function shuffleArray(arr){
  let a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    let j = Math.floor(seededRandom() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const shuffledPics = shuffleArray(techPics);

/* CALCULATE GRID */
const usableWidth = window.innerWidth - (sideMargin * 2);
const usableHeight = window.innerHeight - topMargin - 40;

const step = picSize + gap;

const cols = Math.ceil(usableWidth / step);   // force extra column
const rows = Math.floor(usableHeight / step);let index = 0;

for(let r = 0; r < rows; r++){
  for(let c = 0; c < cols; c++){

    if(index >= shuffledPics.length) break;

    let x = sideMargin + c * step;
    let y = topMargin + r * step;

    let img = document.createElement("img");
    img.src = "techpics/" + shuffledPics[index];

    img.style.position = "absolute";
    img.style.width = picSize + "px";
    img.style.height = picSize + "px";
    img.style.objectFit = "cover";
    img.style.borderRadius = "10px";
    img.style.opacity = "0.85";
    img.style.boxShadow = "2px 2px 8px rgba(0,0,0,0.25)";



    // fixed random rotation but stable
    let angle = Math.floor(seededRandom() * 40) - 20;
    img.style.transform = "rotate(" + angle + "deg)";

    img.style.left = x + "px";
    img.style.top = y + "px";

    picsArea.appendChild(img);

    index++;
  }
}
</script>








</body>
</html>
