function getTodayDate(){
        const today=new Date();

        const dd=String(today.getDate()).padStart(2,'0');
       const mm=String(today.getMonth()+1).padStart(2,'0');
       const yyyy=today.getFullYear();
       return dd+"/"+mm+"/"+yyyy;
}

// File UPLOAD INPUT//

async function saveData(){

    const table = document.getElementById("dataTable");
    const infoTable = document.getElementById("infoTable");
    const username = localStorage.getItem("username");

    let rows = [];

            // ----------------------------
           // 1) PERSONAL INFO (LEFT TABLE)
          // ----------------------------
    let personalRow = [];

    for(let i = 1; i < infoTable.rows.length; i++){
        personalRow.push(infoTable.rows[i].cells[0].innerText.trim());
    }


    rows.push(personalRow);
    rows.push([""]);
    rows.push(["Date","Activity"]);

    // ----------------------------
    // 2) ACTIVITY ROWS (RIGHT TABLE)
    // ----------------------------
           ///for(let i = 0; i < table.rows.length; i++){ ///REPLACED
           for(let i = 1; i < table.rows.length; i++){
           const r = table.rows[i];

           // safety check: must have 2 columns
              if(r.cells.length < 2) continue;

        const dateInput = r.cells[0].querySelector("input");
        const textInput = r.cells[1].querySelector("textarea, input");
        const fileInput = r.cells[1].querySelector("input[type='file']");
        const dateValue = dateInput ? dateInput.value : "";
       
     let activityValue = "";

// 1) if already saved upload exists, keep it
       const hiddenPath = r.cells[1].querySelector("input[type='hidden']");
if(hiddenPath && hiddenPath.value.trim() !== ""){
    activityValue = hiddenPath.value.trim();
}

// 2) if user selected a NEW file, upload it (override hidden)

      if(fileInput && fileInput.files.length > 0){
    console.log("FILE INPUT:", fileInput.files[0]);
   
 const formData = new FormData();
formData.append("username", username);
formData.append("media", fileInput.files[0]);

    //const res = await fetch("http://localhost:3000/upload",{
    const res = await fetch("/upload",{
        method:"POST",
        body:formData
    });

    const result = await res.json();

    console.log("UPLOAD RESULT:", result);
    activityValue = "uploads/" + (result.file || result.filename);
}

    // 3) if no hidden and no file, take text
           if(activityValue === ""){
    activityValue = textInput ? textInput.value.trim().replace(/\n+/g," ") : "";
}

// 🚫 skip header row if it exists inside table
         if(dateValue === "Date" && activityValue === "Activity") continue;

        // skip empty rows
          if(dateValue.trim() === "" && activityValue.trim() === "") continue;

        // skip header row
          if(dateValue.trim().toLowerCase() === "date" &&         activityValue.trim().toLowerCase() === "activity") continue;

rows.push([dateValue, activityValue]);
    }

    //await fetch("http://localhost:3000/save-personal",{
    await fetch("/save-personal",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username, rows})
    });

    alert("Saved successfully");
}
