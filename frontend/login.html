<!DOCTYPE html>
<html>
<head>
<title>Login - LencoAbroad</title>
</head>

<body style="text-align:center; font-family:Arial;">

<h2>Login</h2>

<form id="loginForm">
    <input placeholder="Username" id="username" required><br><br>
    <input type="password" placeholder="Password" id="password" required><br><br>
    <button type="submit">LOGIN</button><br><br>
</form>

<a href="forgot.html">Forgot Password?</a><br><br>
<a href="index.html">Back to Home</a>

<script>
document.getElementById("loginForm").onsubmit = async function(e) {

    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

 //const response = await fetch("http://localhost:3000/login", {
    const response = await fetch("/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ username, password })
    });

    const result = await response.json();

    if(result.success){
        localStorage.setItem("username", result.user.username);
        localStorage.setItem("memberCode", result.user.memberCode);

        window.location.href = "editProfile.html";
    } else {
        alert(result.message);
    }
};
</script>

</body>
</html>
